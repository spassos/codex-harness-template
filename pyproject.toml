# Tooling to develop and test the Copier template itself (not part of generated projects).
[project]
name = "codex-harness-template"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = ["copier>=9.4", "pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
extend-exclude = ["template"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not slow'"
testpaths = ["tests"]
markers = ["slow: renders and runs `make check` in each generated project (needs Docker)"]
