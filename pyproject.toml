# Tooling to develop and test the Copier template itself (not part of generated projects).
[project]
name = "codex-harness-template"
version = "0.1.0"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "copier>=9.4",
    "pytest>=8.3",
    "pyyaml>=6",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
extend-exclude = ["template"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not slow and not smoke'"
testpaths = ["tests"]
markers = [
    "slow: runs make check in each generated project (Docker for integration profiles)",
    "smoke: generates and exercises the default API over HTTP without Docker",
]
