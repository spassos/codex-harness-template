# Project-scoped Codex config (applies once you trust this project in Codex).
# Personal preferences (model, auth, MCP servers) belong in ~/.codex/config.toml.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
model_reasoning_effort = "high"

[sandbox_workspace_write]
# uv needs PyPI to resolve and audit dependencies.
network_access = true

[agents]
# Subagent roles live in .codex/agents/*.toml.
max_threads = 4
max_depth = 1
