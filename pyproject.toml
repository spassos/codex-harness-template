[project]
name = "codex-harness-template"
version = "0.1.0"
description = "Generate Python services with project-scoped Codex skills, agents and SDLC conventions"
requires-python = ">=3.12"
dependencies = ["copier>=9.4,<10"]

[project.scripts]
codex-scaffold = "codex_scaffold.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_scaffold"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 110
extend-exclude = ["template"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers -m 'not slow and not smoke'"
testpaths = ["tests"]
markers = [
    "slow: runs make check in each generated project (Docker for integration profiles)",
    "smoke: generates and exercises the default API over HTTP without Docker",
]
